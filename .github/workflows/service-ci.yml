name: Service CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image_id: ${{ steps.export_image.outputs.image_id }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.9"
          cache: false

      - name: Check runner
        run: |
          uname -s
          docker --version

      - name: Run Go tests
        working-directory: labs/001-tested-container/app
        run: go test -count=1 -v ./...

      - name: Build image
        run: docker build -t aws-ops-forge:lab001 labs/001-tested-container

      - name: Start container
        shell: bash
        run: |
          # Hosted runners use loopback; local DooD runners use a shared network.
          network_args=(--publish 127.0.0.1:8080:8080)
          if [[ -n "${CI_DOCKER_NETWORK:-}" ]]; then
            network_args=(--network "$CI_DOCKER_NETWORK")
          fi
          docker run --detach \
            --name forge-lab001 \
            "${network_args[@]}" \
            aws-ops-forge:lab001

      - name: Check HTTP health
        run: |
          status="$(curl \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 1 \
            --max-time 2 \
            --output /tmp/health-response \
            --write-out '%{http_code}' \
            "${SERVICE_HEALTH_URL:-http://127.0.0.1:8080/healthz}")"

          test "$status" = "200"
          printf 'ok\n' > /tmp/health-expected
          diff -u /tmp/health-expected /tmp/health-response

      - name: Check runtime user
        shell: bash
        run: |
          docker top forge-lab001 -eo pid,uid,gid,args
          process_uid="$(docker top forge-lab001 -eo pid,uid | awk 'NR == 2 { print $2 }')"
          printf 'Observed process UID: %s\n' "$process_uid"
          test "$process_uid" = "65532"

      - name: Save image
        id: export_image
        shell: bash
        run: |
          image_id="$(docker image inspect aws-ops-forge:lab001 --format '{{.Id}}')"
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/service-image.tar" aws-ops-forge:lab001

      - name: Upload tested image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-image
          path: ${{ runner.temp }}/service-image.tar
          if-no-files-found: error
          retention-days: 1

      - name: Clean up container
        if: ${{ always() }}
        run: |
          if docker container inspect forge-lab001 > /dev/null 2>&1; then
            docker rm --force forge-lab001
          fi

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      IMAGE_TAG: ci-${{ github.sha }}

    steps:
      - name: Download tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: service-image
          path: ${{ runner.temp }}/tested-image

      - name: Load tested image
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
        run: |
          test -n "$EXPECTED_IMAGE_ID"
          docker load --input "$RUNNER_TEMP/tested-image/service-image.tar"
          actual_image_id="$(docker image inspect aws-ops-forge:lab001 --format '{{.Id}}')"
          printf 'Expected: %s\nActual:   %s\n' "$EXPECTED_IMAGE_ID" "$actual_image_id"
          test "$actual_image_id" = "$EXPECTED_IMAGE_ID"

      - name: Prepare publication target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          : "${AWS_REGION:?AWS_REGION must be configured}"
          : "${AWS_ROLE_ARN:?AWS_ROLE_ARN must be configured}"
          : "${ECR_REPOSITORY_URL:?ECR_REPOSITORY_URL must be configured}"
          : "${IMAGE_TAG:?IMAGE_TAG must be set}"

          ECR_REGISTRY="${ECR_REPOSITORY_URL%%/*}"
          IMAGE_REF="${ECR_REPOSITORY_URL}:${IMAGE_TAG}"

          printf 'ECR_REGISTRY=%s\n' "$ECR_REGISTRY" >> "$GITHUB_ENV"
          printf 'IMAGE_REF=%s\n' "$IMAGE_REF" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin \
                "$ECR_REGISTRY"

      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker tag aws-ops-forge:lab001 "$IMAGE_REF"
          docker push "$IMAGE_REF"

      - name: Record published digest
        id: published_image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          repository_name="${ECR_REPOSITORY_URL#*/}"

          digest="$(aws ecr batch-get-image \
            --region "$AWS_REGION" \
            --repository-name "$repository_name" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"

          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'ECR did not return a valid image digest.\n' >&2
            exit 1
          fi

          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

          {
            printf '### Published image\n\n'
            # Markdown backticks are literal formatting, not shell substitutions.
            # shellcheck disable=SC2016
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            # shellcheck disable=SC2016
            printf -- '- Tag: `%s`\n' "$IMAGE_TAG"
            # shellcheck disable=SC2016
            printf -- '- ECR digest: `%s`\n' "$digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of ECR
        if: >-
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.ECR_REGISTRY != ''
        shell: bash
        run: docker logout "$ECR_REGISTRY"
